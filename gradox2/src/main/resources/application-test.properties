# Test profile with H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled for tests: migrations are Postgres-dialect (oid blobs) and will not run on H2.
# Tests rely on Hibernate create-drop. Migrations are verified separately against Postgres.
spring.flyway.enabled=false

# S3 configuration for tests (no real bucket is contacted; InMemoryS3Client is @Primary under the test profile)
s3.endpoint=http://localhost:9000
s3.access-key=test-access-key
s3.secret-key=test-secret-key
s3.bucket-name=test-bucket
s3.region=auto

# JWT configuration for tests
jwt.secret=test-jwt-secret-that-is-long-enough-for-hs256
jwt.expiration=3600000

# Disable mail for tests
spring.mail.host=localhost
spring.mail.port=3025

# Scheduled task interval (proposal auto-close). Kept very high so the
# background scheduler never interferes with test determinism; the logic
# is exercised directly through IVoteService in the tests.
app.proposal-expiration-check-ms=86400000
