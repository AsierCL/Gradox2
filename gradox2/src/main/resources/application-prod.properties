spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

s3.endpoint=${S3_ENDPOINT}
s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT}}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket-name=${S3_BUCKET_NAME}
s3.region=auto
s3.presign.ttl-seconds=${S3_PRESIGN_TTL_SECONDS:120}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.base-url=${APP_BASE_URL}

# IP y scheme del cliente desde cabeceras X-Forwarded-* (require un proxy de
# confianza delante que las sobrescriba; Render lo garantiza en produccion)
server.forward-headers-strategy=framework

# Swagger/OpenAPI desactivado en produccion (los endpoints dejan de existir)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator: health checks con detalles por componente (db, ping, diskSpace)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Info endpoint: identifica la versión desplegada
info.app.name=Gradox2
info.app.version=0.1.0
info.app.java.version=21

# --- HIKARICP CONNECTION POOL (Supabase Tuning) ---
# Número máximo de conexiones simultáneas que Spring Boot abrirá
spring.datasource.hikari.maximum-pool-size=5
# Número mínimo de conexiones que se mantienen abiertas si no hay tráfico
spring.datasource.hikari.minimum-idle=1
# Tiempo máximo (ms) que una conexión puede estar inactiva antes de cerrarse (5 min)
spring.datasource.hikari.idle-timeout=300000
# Tiempo máximo (ms) que la app esperará si no hay conexiones libres (20 seg)
spring.datasource.hikari.connection-timeout=20000
# Tiempo máximo de vida (ms) de una conexión para evitar bloqueos de red (14 min)
spring.datasource.hikari.max-lifetime=840000
