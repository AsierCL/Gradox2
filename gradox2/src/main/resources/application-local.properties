spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

s3.endpoint=${S3_ENDPOINT}
s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT}}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket-name=${S3_BUCKET_NAME}
s3.region=auto
s3.presign.ttl-seconds=${S3_PRESIGN_TTL_SECONDS:120}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:local-dev-jwt-secret-min-32-bytes-long}
jwt.expiration=${JWT_EXPIRATION:900000}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.base-url=${APP_BASE_URL:http://localhost:8080}

# La IP del cliente NO se toma de X-Forwarded-* automáticamente: la política de proxies de confianza
# vive en ClientIpResolver (WAVE1 S3). En local no hay proxy delante, así que la cabecera se ignora.
server.forward-headers-strategy=none
app.rate-limit.trusted-proxy-hops=${RATE_LIMIT_TRUSTED_PROXY_HOPS:0}
app.rate-limit.max-buckets=${RATE_LIMIT_MAX_BUCKETS:2000}
app.rate-limit.bucket-ttl-ms=${RATE_LIMIT_BUCKET_TTL_MS:1800000}

# Orden de los tags en Swagger UI. Springdoc tradicionalmente numera los tags
# (ej. "01. Autenticación") para controlar el orden, pero eso obliga a renumerar
# al insertar una categoría nueva y genera nombres inválidos en los generadores
# de código del frontend. Aquí el orden se define como lista de nombres planos
# (se usan escapes Unicode \u00f3 por el encoding ISO-8859-1 de .properties).
springdoc.tags-order=Autenticaci\u00f3n,Usuarios,Roles y Promociones,Archivos,Asignaturas,Propuestas de Archivos,Votaciones,Hilos / Comentarios,Configuraci\u00f3n de Votaciones,Administraci\u00f3n,Health Check
