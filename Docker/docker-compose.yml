# NOTA TLS: se despliega temporalmente SIN HTTPS (trafico en claro).
# Antes de exponer credenciales reales, colocar un proxy TLS
# (Caddy/nginx o el host) delante del puerto 8080.
#
# NOTA: la base de datos NO se despliega aqui: PostgreSQL lo aloja Supabase
# (ver SPRING_DATASOURCE_URL en .env) y los archivos van a S3 (Cloudflare R2).
services:
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: gradox2_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      APP_BASE_URL: ${APP_BASE_URL}
      LOG_DIR: /app/logs
      BOOTSTRAP_MASTER_USERNAME: ${BOOTSTRAP_MASTER_USERNAME}
      BOOTSTRAP_MASTER_PASSWORD: ${BOOTSTRAP_MASTER_PASSWORD}
      BOOTSTRAP_MASTER_EMAIL: ${BOOTSTRAP_MASTER_EMAIL}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    mem_limit: 1024m
    mem_reservation: 768m
    cpus: 1.0
    profiles: ["full"]
