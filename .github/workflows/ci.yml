name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./gradox2

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: './gradox2/pom.xml'

    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x mvnw

    - name: Ejecutar Tests (con H2 y Fake S3)
      run: ./mvnw test -B
