name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./gradox2

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: './gradox2/pom.xml'

    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x mvnw

    - name: Ejecutar Tests (con H2 y Fake S3)
      run: ./mvnw test -B

  # Las migraciones Flyway son dialecto PostgreSQL y el perfil de tests usa H2
  # con Flyway apagado, asi que un desajuste entre migraciones y entidades solo
  # se descubriria al arrancar produccion (ddl-auto=validate). Este job aplica
  # V1..Vn sobre un PostgreSQL real y valida el mapeo JPA contra ese schema.
  migrations:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./gradox2

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gradoxdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/gradoxdb
      POSTGRES_TEST_USER: postgres
      POSTGRES_TEST_PASSWORD: postgres

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: './gradox2/pom.xml'

    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x mvnw

    - name: Aplicar migraciones Flyway y validar entidades (PostgreSQL)
      run: ./mvnw test -B -Dtest=PostgresMigrationIT

  # Publica el contrato OpenAPI que consume el frontend. El JSON se genera en
  # cada corrida y viaja como artefacto: versionarlo obligaba a un diff enorme
  # en cada cambio de API y se desincronizaba en silencio.
  openapi:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./gradox2

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: './gradox2/pom.xml'

    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x mvnw

    - name: Generar openapi.json
      run: ./mvnw test -B -Dtest=OpenApiContractTest -Dopenapi.export=true

    - name: Publicar el contrato como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: openapi
        path: gradox2/target/openapi.json
